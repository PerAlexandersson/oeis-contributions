name: Validate proposals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate proposals and regenerate data
        run: python3 scripts/validate.py --index --bfiles bfiles
      - name: Index is up to date
        run: git diff --exit-code PROPOSALS.md || { echo "Run: python3 scripts/validate.py --index"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: bfiles
          path: bfiles
